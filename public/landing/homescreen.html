<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jobday widget on the Home Screen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{--accent:#29B8FF;--accentSoft:#102A3A;--success:#2BC489;--successSoft:#102A22;--warning:#F4A626;--warningSoft:#2C2310;--danger:#F26B75;
--bg:#0E141B;--surface:#161E27;--surface1:#1E2832;--surface2:#28333F;--line:#28333F;--lineStrong:#36434F;
--text1:#F2F5F8;--text2:rgba(242,245,248,.66);--text3:rgba(242,245,248,.42);--onA:#1A2A3A;--onB:#0F1F2E;--ink:#06131C;
--f:'Manrope',-apple-system,system-ui,sans-serif;--z:1;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#0b1a2b}
body{font-family:var(--f);font-size:14px;line-height:1.4;color:var(--text1);overflow:hidden}
.zw{zoom:var(--z)}
.ov{font-size:11.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text3)}
/* ================= WIDGET ================= */
.w{position:relative;border-radius:22px;background:var(--surface);overflow:hidden;font-family:var(--f);color:var(--text1);
   padding:16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.w.on{background:linear-gradient(160deg,var(--onA),var(--onB))}
.w.s{width:170px;height:170px}
.w.m{width:364px;height:170px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.top .c1,.top .c3{display:flex;flex-direction:column;gap:2px;min-width:0}
.top .c3{align-items:flex-end;text-align:right}
.top .k{font-size:11.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.w.s .top .k{font-size:11px;letter-spacing:.6px}
.top .v{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1}
.w.s .top .v{font-size:16px}
.w.m .top .v{font-size:20px;font-weight:700}
.ap{font-style:normal;font-size:.6em;font-weight:700;color:var(--text3);margin-left:2px}
.top .c2{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text2);font-size:11px;font-weight:700;white-space:nowrap;padding-bottom:1px}
.w.m .top .c2{flex-direction:row;gap:6px;font-size:12px;flex:none;justify-content:center}
.w.m .top .c1,.w.m .top .c3{flex:1}
.w.m .top .c2 .dash{width:18px;height:0;border-top:1.5px dashed var(--lineStrong)}
.top .c2 svg{width:14px;height:14px}
.k.warn,.v.warn,.v.warn .ap{color:var(--warning)}

.tl{position:relative}
.trk,.fill{position:absolute;height:3px;border-radius:2px}
.trk{background:repeating-linear-gradient(90deg,var(--lineStrong) 0 5px,transparent 5px 9px)}
.trk.warn{background:repeating-linear-gradient(90deg,var(--warning) 0 5px,transparent 5px 9px);opacity:.7}
.trk.dim{opacity:.6}
.fill{background:var(--accent)}
.pt{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center}
.pt.site{width:18px;height:18px}
.pt.done{background:var(--accent);color:var(--ink)}
.pt.cur{background:var(--accent);color:var(--ink);box-shadow:0 0 0 4px var(--accentSoft)}
.pt.ok{background:var(--success);color:var(--ink)}
.pt.next{background:var(--surface);border:2px dashed var(--accent)}
.pt.plan{background:var(--surface);border:2px dashed var(--text3)}
.pt.miss{background:var(--warningSoft);border:2px dashed var(--warning)}
.pt.home{width:9px;height:9px;background:var(--surface);border:2px solid var(--text3)}
.pt.home.hdone{background:var(--accent);border-color:var(--accent)}
.pt svg{width:11px;height:11px}
.pt.add{width:22px;height:22px;border:2px dashed var(--warning);background:var(--warningSoft);color:var(--warning)}
.mk{position:absolute;transform:translate(-50%,-50%)}
.mk.now{width:8px;height:8px;border-radius:50%;background:var(--text1);box-shadow:0 0 0 2px var(--onB)}
.mk.car{width:22px;height:15px;border-radius:8px;background:var(--accent);color:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 2px var(--onB)}
.mk.car svg{width:12px;height:12px}
.mk.brk{width:15px;height:15px;border-radius:50%;background:var(--warning);color:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 2px var(--onB)}
.mk.brk svg{width:9px;height:9px}
.tick{position:absolute;width:2px;height:10px;border-radius:1px;background:var(--text2);transform:translate(-50%,-50%)}
.lb{position:absolute;transform:translateX(-50%);font-size:11px;font-weight:700;line-height:1.1;white-space:nowrap;text-align:center;font-variant-numeric:tabular-nums;color:var(--text2)}
.w.m .lb.nm{max-width:84px}
.lb.nm{max-width:62px;overflow:hidden;text-overflow:ellipsis;color:var(--text3)}
.lb.c-cur{color:var(--text1)} .lb.nm.c-cur{color:var(--text1)}
.lb.c-next{color:var(--text1)}
.lb.c-plan{color:var(--text3)}
.lb.c-miss{color:var(--warning)}
.lb .pl{display:block;font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--warning);margin-top:1px}
.stub{position:absolute;font-size:11px;font-weight:800;color:var(--text3)}
.st{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap;min-width:0}
.st .d{width:7px;height:7px;border-radius:50%;flex:none}
.st .t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.st .t i{font-style:normal;color:var(--text2)}
.st .meta{margin-left:auto;color:var(--text3);flex:none;padding-left:8px}
.hero2{display:flex;flex-direction:column;gap:2px}
.hero2 .v{font-size:16px;font-weight:800}
.w.m .hero2 .v{font-size:20px;font-weight:700}

.hs{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(90% 60% at 20% 8%,#2c5b86 0%,transparent 60%),radial-gradient(80% 60% at 90% 70%,#1f6b6a 0%,transparent 62%),linear-gradient(170deg,#12263d,#0b1a2b 60%,#0a1420)}
.sb{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 0;font-weight:800;font-size:15px;color:#fff}
.sb .r{display:flex;gap:6px;align-items:center}.sb i{display:block;background:#fff;border-radius:2px}
.date{padding:6px 28px 0;color:rgba(255,255,255,.75);font-size:13px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 0;padding:16px 22px 0;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:11px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.app .ic{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.app .ic svg{width:30px;height:30px;color:#fff}
.app .ic img{width:60px;height:60px;border-radius:14px;display:block}
.wslot{padding:20px 26px 0;display:flex;justify-content:center}
.dock{position:absolute;left:12px;right:12px;bottom:14px;height:92px;border-radius:30px;background:rgba(255,255,255,.18);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(4,1fr);place-items:center}
.dots{position:absolute;left:0;right:0;bottom:116px;display:flex;justify-content:center;gap:7px}.dots b{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}.dots b:first-child{background:#fff}
</style>
<div class="hs">
<div class="sb"><span>9:41</span><span class="r"><i style="width:17px;height:10px"></i><i style="width:15px;height:10px"></i><i style="width:24px;height:11px;border-radius:3px"></i></span></div>
<div class="date">Tuesday, Sep 29</div>
<div class="grid"><div class="app"><div class="ic" style="background:#e5484d"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></div>Calendar</div><div class="app"><div class="ic" style="background:#2f7de1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0119 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>Maps</div><div class="app"><div class="ic" style="background:#30a46c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a2 2 0 012 2v8a2 2 0 01-2 2h-7l-5 4v-4H5a2 2 0 01-2-2V7a2 2 0 012-2z"/></svg></div>Messages</div><div class="app"><div class="ic" style="background:#5f6b7a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div>Camera</div></div><div class="wslot"><div id="root"></div></div><div class="grid" style="padding-top:22px"><div class="app"><div class="ic" style="background:#f5a623"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg></div>Notes</div><div class="app"><div class="ic" style="background:#6e56cf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M4 16l5-5 4 4 3-3 4 4"/></svg></div>Photos</div><div class="app"><div class="ic" style="background:#0aa0c8"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3.5 3 13.5 0 17M12 3.5c-3 3.5-3 13.5 0 17"/></svg></div>Browser</div><div class="app"><div class="ic" style="background:#0E141B"><img src="../img/app-icon.png" alt=""></div>Jobday</div></div><div class="dots"><b></b><b></b></div><div class="dock"><div class="app"><div class="ic" style="background:#30a46c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l3 1 1.5 4-2 1.5a11 11 0 005 5l1.5-2 4 1.5 1 3a2 2 0 01-2 2A15 15 0 014 6a2 2 0 012-2z"/></svg></div></div><div class="app"><div class="ic" style="background:#2f7de1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg></div></div><div class="app"><div class="ic" style="background:#5f6b7a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></div></div><div class="app"><div class="ic" style="background:#e5484d"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a2 2 0 012 2v8a2 2 0 01-2 2h-7l-5 4v-4H5a2 2 0 01-2-2V7a2 2 0 012-2z"/></svg></div></div></div></div>
<style>.dock .app .ic{width:60px;height:60px}</style>
<script>
const IC={
  check:'<svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2 5 8.6l4.5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  car:'<svg viewBox="0 0 16 16" fill="none"><path d="M3 9.5 4.3 5.6A1.5 1.5 0 0 1 5.7 4.6h4.6a1.5 1.5 0 0 1 1.4 1L13 9.5v2.5a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5v-.8H5v.8a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5V9.5Z" fill="currentColor"/><path d="M3 9.5h10" stroke="#06131C" stroke-width="1"/></svg>',
  pause:'<svg viewBox="0 0 10 10"><rect x="2" y="1.5" width="2" height="7" rx="1" fill="currentColor"/><rect x="6" y="1.5" width="2" height="7" rx="1" fill="currentColor"/></svg>',
  plus:'<svg viewBox="0 0 12 12" fill="none"><path d="M6 2.5v7M2.5 6h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
};
const tm=(s,suf=true)=>{const [a,b]=s.split(' ');return suf&&b?`${a}<i class="ap">${b}</i>`:a};
const mk=(list,sts)=>list.map((r,i)=>({k:r[0],t:r[1],n:r[2],s:sts[i]}));

const DAY3=[['home','7:05 AM','Home'],['site','7:30 AM','Depot'],['site','11:05 AM','Birch Lane'],['site','2:00 PM','Office'],['home','3:55 PM','Home']];
const DAY5=[['home','7:05 AM','Home'],['site','7:30 AM','Depot'],['site','9:10 AM','Willow Bend'],['site','11:05 AM','Birch Lane'],['site','2:00 PM','Office'],['site','3:40 PM','Harbor Plaza'],['home','5:10 PM','Home']];
const WFH=[['site','8:00 AM','WFH'],['site','2:00 PM','Office'],['home','4:55 PM','Home']];
const MON=[['home','7:05 AM','Home'],['site','7:30 AM','Depot'],['site','10:40 AM','Lakeside Market'],['site','1:30 PM','Office'],['home','4:00 PM','Home']];

/* timeline renderer. items in day index space; prog/tick are fractional indices */
function line(items,o){
  const W=o.W, s=o.mode==='s';
  const H=s?(o.names?62:56):64, Y=s?22:30;
  let from=o.from??0, to=o.to??items.length-1;
  const last=items.length-1;
  const pos={};
  const vis=[];for(let i=from;i<=to;i++)vis.push(i);
  if(o.edgeHomes){
    const sites=vis.filter(i=>items[i].k!=='home');
    const inset=o.inset??34;
    vis.forEach(i=>{if(items[i].k==='home')pos[i]=(i===from&&from===0)?(o.hideHomes?0:6):(o.hideHomes?W:W-6)});
    sites.forEach((i,j)=>pos[i]=sites.length===1?W/2:inset+j*(W-2*inset)/(sites.length-1));
  }else{
    const inset=o.inset??20;
    vis.forEach((i,j)=>pos[i]=vis.length===1?W/2:inset+j*(W-2*inset)/(vis.length-1));
  }
  const X=v=>{
    if(v<=from){return from>0?Math.max(0,pos[from]-(from-v)*pos[from]):pos[from]}
    if(v>=to){return to<last?Math.min(W,pos[to]+(v-to)*(W-pos[to])):pos[to]}
    const a=Math.floor(v),b=Math.ceil(v);return pos[a]+(pos[b]-pos[a])*(v-a);
  };
  const L=from>0?0:pos[from], R=to<last?W:pos[to];
  const fl=from>0?18:0, fr=to<last?18:0;
  const mask=`-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 ${fl}px,#000 calc(100% - ${fr}px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 ${fl}px,#000 calc(100% - ${fr}px),transparent 100%)`;
  let h=`<div class="tl" style="width:${W}px;height:${H}px">`;
  h+=`<div class="trk${o.dim?' dim':''}" style="left:${L}px;width:${R-L}px;top:${Y-1.5}px;${mask}"></div>`;
  if(o.prog!=null){const x=X(o.prog);h+=`<div class="fill" style="left:${L}px;width:${Math.max(0,x-L)}px;top:${Y-1.5}px;${mask}"></div>`}
  if(o.tick!=null)h+=`<div class="tick" style="left:${X(o.tick)}px;top:${Y}px"></div>`;
  const hidL=items.slice(0,from).filter(i=>i.k==='site').length, hidR=items.slice(to+1).filter(i=>i.k==='site').length;
  if(hidL)h+=`<div class="stub" style="left:0;top:${Y-20}px">+${hidL}</div>`;
  if(hidR)h+=`<div class="stub" style="right:0;top:${Y-20}px">+${hidR}</div>`;
  vis.forEach(i=>{
    const it=items[i],x=pos[i];
    if(it.k==='home'){
      if(o.hideHomes)return;
      h+=`<div class="pt home${it.s==='done'?' hdone':''}" style="left:${x}px;top:${Y}px"></div>`;
      if(s){h+=`<div class="lb c-plan" style="left:${x}px;top:${Y+12}px">Home</div>`}
      return;
    }
    const st=o.dim?'plan':it.s;
    const inner=(st==='done'||st==='cur'||st==='ok')?IC.check:'';
    h+=`<div class="pt site ${st}" style="left:${x}px;top:${Y}px">${inner}</div>`;
    const cls=st==='cur'?'c-cur':st==='next'?'c-next':st==='plan'?'c-plan':st==='miss'?'c-miss':'';
    const showT=!o.timesOnly||o.timesOnly.includes(i);
    if(s){
      if(showT)h+=`<div class="lb ${cls}" style="left:${x}px;top:${o.altUp===i?Y-24:Y+14}px">${tm(it.t,false)}${st==='miss'?'<span class="pl">PLANNED</span>':''}${o.names?`<span class="lb nm ${cls}" style="position:static;transform:none;display:block;margin-top:2px">${it.n}</span>`:''}</div>`;
    }else{
      h+=`<div class="lb ${cls}" style="left:${x}px;top:${Y-26}px">${tm(it.t)}</div>`;
      h+=st==='miss'?`<div class="lb c-miss" style="left:${x}px;top:${Y+14}px;font-weight:800;letter-spacing:.4px">PLANNED</div>`
                    :`<div class="lb nm ${cls}" style="left:${x}px;top:${Y+14}px">${it.n}</div>`;
    }
  });
  if(o.marker&&o.prog!=null){
    const x=X(o.prog);
    if(o.marker==='now')h+=`<div class="mk now" style="left:${x}px;top:${Y}px"></div>`;
    if(o.marker==='car')h+=`<div class="mk car" style="left:${x}px;top:${Y}px">${IC.car}</div>`;
    if(o.marker==='brk')h+=`<div class="mk brk" style="left:${x}px;top:${Y}px">${IC.pause}</div>`;
  }
  return h+'</div>';
}

function topRow(t,m){
  if(!t)return '';
  const c2=m?`<span class="dash"></span>${IC.car}<span>${t.c}</span><span class="dash"></span>`:`${IC.car}<span>${t.cs||t.c}</span>`;
  return `<div class="top"><div class="c1"><span class="k">${m&&t.lp?t.l+' · '+t.lp:t.l}</span><span class="v">${tm(t.lt)}</span></div>
  <div class="c2">${c2}</div>
  <div class="c3"><span class="k${t.rw?' warn':''}">${m&&t.rp?t.r+' · '+t.rp:(t.rs||t.r)}</span><span class="v${t.rw?' warn':''}">${tm(t.rt)}</span></div></div>`;
}
function statusRow(st,m){
  return `<div class="st"><span class="d" style="background:var(--${st.c})"></span><span class="t">${st.t}${st.x&&(m||(st.t+st.x).length<=20)?` <i>· ${st.x}</i>`:''}</span>${m&&st.meta?`<span class="meta">${st.meta}</span>`:''}</div>`;
}
function widget(size,S,v){
  const m=size==='m', W=m?332:138;
  let body;
  if(S.custom){body=S.custom(m,W)}
  else{
    const it=mk(S.day,S.sts);
    let o={mode:size,W,prog:S.prog,tick:S.tick,marker:S.marker};
    if(m){Object.assign(o,{edgeHomes:true,inset:34})}
    else{
      const vv=v||'C', a=S.anchor, last=it.length-1;
      if(vv==='A'){Object.assign(o,{edgeHomes:true,hideHomes:true,inset:20});
        const n=it.filter(x=>x.k==='site').length; if(n>=5){o.timesOnly=[a,a+1];o.altUp=a+1;}}
      if(vv==='B'){Object.assign(o,{from:a,to:Math.min(a+1,last),inset:32,names:true})}
      if(vv==='C'){let f=Math.max(0,Math.min(a-1,last-2));Object.assign(o,{from:f,to:Math.min(f+2,last)})}
    }
    body=topRow(S.top,m)+line(it,o);
  }
  return `<div class="zw"><div class="w ${size}${S.on?' on':''}">${body}${statusRow(S.st,m)}</div></div>`;
}

const TOP_ON={l:'Leave',lp:'Birch Lane',lt:'1:45 PM',c:'15m drive',cs:'15m',r:'Arrive',rp:'Office',rt:'2:00 PM'};
const ONSHIFT3={day:DAY3,sts:['done','done','cur','next','plan'],prog:2.74,tick:2.91,marker:'now',anchor:2,on:true,top:TOP_ON,
  st:{c:'success',t:'On shift',x:'site 2 of 3',meta:'Logged 5h 10m'}};
const ONSHIFT5={day:DAY5,sts:['done','done','done','cur','next','plan','plan'],prog:3.74,tick:3.91,marker:'now',anchor:3,on:true,top:TOP_ON,
  st:{c:'success',t:'On shift',x:'site 3 of 5',meta:'Logged 5h 10m'}};


const SCEN={
 drive:{day:DAY3,sts:['done','done','next','plan','plan'],prog:1.86,tick:1.70,marker:'car',anchor:2,on:true,
    top:{l:'Left',lp:'Depot',lt:'10:00 AM',c:'1h 5m drive',cs:'1h 5m',r:'Arrive',rp:'Birch Lane',rt:'11:05 AM'},
    st:{c:'accent',t:'Driving',x:'to Birch Lane',meta:'Logged 3h 05m'}},
