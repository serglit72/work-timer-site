.bnh{display:flex;gap:12px;align-items:flex-start}.bic{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#06131c;display:grid;place-items:center;flex:none}.bic svg{width:19px;height:19px}
.bt0{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bt1{font-size:16px;font-weight:800;margin-top:3px}.bt2{font-size:12.5px;font-weight:600;color:var(--text-2);margin-top:2px}

const hmT=x=>{x=((x%1440)+1440)%1440;let h=Math.floor(x/60),mm=x%60,ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(mm).padStart(2,'0')} ${ap}`};

{let n=0;const ord=['1st','2nd','3rd','4th'];TODAY.sites.forEach(s=>s.brk.forEach(b=>{b.lb=b.k=='Break'?ord[n++]+' Break':b.k}))}

function rows(d){
const R=[];let prev='home',t=d.leave;
R.push({k:'leaveHome',t});

}
function totals(d){const w=d.sites.reduce((a,s)=>a+s.e-s.s-s.brk.filter(b=>!b.paid).reduce((x,b)=>x+b.d,0),0);const R=rows(d);const dv=R.filter(r=>r.k=='drive').reduce((a,r)=>a+r.d,0);const br=d.sites.reduce((a,s)=>a+s.brk.reduce((x,b)=>x+b.d,0),0);return{w,dv,br,end:R.at(-1).t}}

function timeline(d,now){
const R=rows(d);

}else{

function hero(st,now){

<div class="chips" style="margin-top:12px"><span class="chip" style="background:var(--success-soft);color:var(--success)">${I.chk}Meal & rest breaks OK</span><span class="chip">Matches plan</span></div></div>`;
}
const tLeave=t=>t.stops.length?t.stops[0].s-dr('home',t.stops[0].nm):null;
function tomorrowCard(now,key='tmr'){
const src=key=='tmr'?TMR:PL[key];const t=editT==key?draft:src;const lv=tLeave(t);
const head=`<div class="tmh" data-tt="${key}"><span class="lab">${I.cal}${key=='tmr'?'Tomorrow · '+t.date.slice(0,3):'Next shift · '+t.date.slice(0,3)+', '+t.date.split(', ')[1]}</span>${key=='tmr'?`<span class="lk num">${I.lock}editable until 12:00 AM</span>`:''}</div>`;
if(editT!=key){
let prev='home';
const list=t.stops.map(s=>{const r=`<div class="st num"><span class="tt">${hmT(s.s)}</span><span class="nm">${s.nm}</span><span class="du">${du(s.d)}</span></div>`;prev=s.nm;return r}).join('');
const last=t.stops.at(-1);
return `<div class="card tm">${head}<div class="tmb" data-tt="${key}"><div class="lv"><span class="k">Leave home</span><span class="v num">${lv!=null?hm(lv):'—'}</span></div><div class="stl">${list}<div class="st num"><span class="tt">${hmT(last.s+last.d)}</span><span class="nm" style="color:var(--text-2)">Leave site</span><span></span></div></div>
<div class="tmf">${savedAt==key?`<span class="saved">${I.chk}Saved</span>`:`<span class="lab" style="letter-spacing:.04em">${t.stops.length} site${t.stops.length>1?'s':''} · ${du(t.stops.reduce((a,s)=>a+s.d,0))}</span>`}<button class="ed">${I.edit}${key=='tmr'?'Edit tomorrow':'Edit shift'}</button></div></div></div>`;}
const stops=t.stops.map((s,j)=>{const prevN=j?t.stops[j-1].nm:'home';const gap=j?s.s-(t.stops[j-1].s+t.stops[j-1].d):null;const need=dr(prevN,s.nm);
return `${j?`<div class="legd num" style="${gap<need?'color:var(--danger)':''}">${I.car}${du(need)} drive${gap<need?` · only ${du(Math.max(0,gap))} gap — shift start`:''}</div>`:''}
<div class="est"><div class="top"><span class="ix">${j+1}</span><span class="nm">${s.nm}</span><button class="mv" data-mv="${j}" data-v="-1" ${j==0?'disabled':''} aria-label="Move up">${I.up}</button><button class="mv" data-mv="${j}" data-v="1" ${j==t.stops.length-1?'disabled':''} aria-label="Move down">${I.dn}</button><button class="del" data-del="${j}" aria-label="Remove">${I.x}</button></div>
<div class="ctl"><div class="stp"><button data-ts="${j}" data-v="-15">${I.min}</button><div><div class="l">Arrive</div><div class="v num">${hmT(s.s)}</div></div><button data-ts="${j}" data-v="15">${I.plus}</button></div>
<div class="stp"><button data-td="${j}" data-v="-15">${I.min}</button><div><div class="l">On site</div><div class="v num">${du(s.d)}</div></div><button data-td="${j}" data-v="15">${I.plus}</button></div></div></div>`}).join('');
const used=t.stops.map(s=>s.nm);
const add=Object.keys(SITES).filter(n=>!used.includes(n)||true).map(n=>`<button class="ach" data-add="${n}">${I.plus}${n}</button>`).join('');
return `<div class="card tm">${head}<div class="edr">
${lv!=null?`<div class="autol num"><span>Leave home (auto, ${du(dr('home',t.stops[0].nm))} drive)</span><b>${hmT(lv)}</b></div>`:''}
${stops}<div class="addr"><span class="l">Add site</span>${add}</div>
<div class="brow" style="margin-top:6px"><button class="btn ghost" data-tcancel>Cancel</button><button class="btn" data-tsave>${I.chk}Save</button></div></div></div>`;
}

function morningSheet(){
const d=TODAY,R=rows(d),first=d.sites[0];
const list=[`<div class="st num"><span class="tt">${hmT(d.leave)}</span><span class="nm">Leave home</span><span class="du">${du(first.s-d.leave)} drive</span></div>`].concat(d.sites.map(s=>`<div class="st num"><span class="tt">${hmT(s.s)}</span><span class="nm">${s.nm}</span><span class="du">${du(s.e-s.s)}</span></div>`),[`<div class="st num"><span class="tt">${hmT(R.at(-1).t)}</span><span class="nm">Home</span><span></span></div>`]).join('');
return `<div class="grab"></div><div class="eb">${I.sun}Good morning · 6:40 AM</div><h3>Is today's plan still on?</h3><p class="sub">Tuesday, Sep 29 · 2 sites. Confirm and I'll track the day automatically.</p>
<div class="pl">${list}</div>
<div class="trf num">${I.car}Traffic now: 27 min to Office (+2). Leave by 7:03 AM.</div>
<div class="col"><button class="btn" data-start>${I.chk}Yes, start my day</button><button class="btn ghost" data-editplan>${I.edit}Change today's plan</button><a class="txtb" href="#" data-gooff style="text-align:center;text-decoration:none;line-height:40px">Not working today</a></div>`;
}
function reviewSheet(){
const d=TODAY,R=rows(d),T=totals(d);
const it=[['Left home',hmT(d.leave)+' · auto-detected']];
d.sites.forEach(s=>{it.push([s.nm,`${hmT(s.s)} – ${hmT(s.e)} · ${du(s.e-s.s)}`]);s.brk.forEach(b=>it.push([`${b.lb} · ${b.paid?'paid':'unpaid'}`,`${hmT(b.s)} – ${hmT(b.s+b.d)}`,b.k=='Lunch'?'Lunch ended by timer — check':'']))});
it.push(['Arrived home',hmT(R.at(-1).t)]);
return `<div class="grab"></div><div class="eb" style="color:var(--success)">${I.chk}Review day</div><h3 class="num">${du(T.w)} worked</h3><p class="sub num">Drive ${du(T.dv)} · breaks ${du(T.br)}. Tap Edit on anything that's off.</p>
${it.map(x=>`<div class="rv"><span class="c${x[2]?' w':''}">${x[2]?'!':I.chk}</span><div><div class="t">${x[0]}</div><div class="s num${x[2]?' w':''}">${x[2]||x[1]}</div></div><button class="e">Edit</button></div>`).join('')}
<div class="brow" style="margin-top:18px"><button class="btn ghost" data-close>Later</button><button class="btn" data-confirm>${I.chk}Confirm day</button></div>`;
}

const NOTES={
morning:{q:'Утром, до выезда: подтвердить план одним тапом.',good:['Окно появляется само при первом открытии после 5:00 AM или по push за 30 мин до выезда','План дня, пробки прямо сейчас и скорректированное время выезда','Три исхода: начать день, поправить план, «не работаю» (→ экран Day off)']},
before:{q:'До смены: главный вопрос — когда выходить.',good:['Герой-карточка: время выезда + обратный отсчёт, трафик, кнопка Google Maps','Весь план дня таймлайном: выезд → дорога → сайты с перерывами → дом','Перерывы и ланч — отдельные строки (Paid/Unpaid), а не зачёркнутый текст']},
during:{q:'Во время смены: сколько осталось и что дальше.',good:['Карточка текущего сайта: время ухода, остаток, прогресс','Ближайший перерыв с кнопкой «Start now»','Красная линия «сейчас» между событиями; пройденная часть — сплошной синий рельс','Google Maps — у ближайшего переезда']},
after:{q:'После смены: проверить и подтвердить лог.',good:['Итог: отработано, дорога, перерывы','«Review & confirm day» — список событий, спорные помечены ⚠','После подтверждения день уходит в Work log']},
off:{q:'Нерабочий день: неделя и следующая смена.',good:['Карточка дня по типу: Day off — штриховка, PTO — --pro, Holiday — --danger','Недельная сводка — только здесь (правило проекта)','Next shift открывается в редактор по тапу или кнопке «Edit shift»']},
arrived:{q:'Прибытие на сайт: PWSL, затем голосовой отчёт — по очереди.',good:['Очередь приглашений: одно окно за раз, второе — через ~2 сек после закрытия первого; внизу баннера «Voice report next»','Snooze 10 min ставит приглашение в конец очереди, не перекрывая другое','Голосовой отчёт — фиолетовый (--pro), PWSL — оранжевый chip, чтобы не путать','Voice report связывается с сайтом в Work log; вызов также из таба Report','Баннер сверху появляется сам в момент прибытия (гео-детект) — без новых кнопок на экране','«Snooze 10 min» — баннер вернётся (в демо через ~6 сек); × — просто скрыть','Статус отчёта живёт в строке сайта на таймлайне: pending → тап открывает модуль, sent — зелёный','Та же точка входа, что и в Report-табе: модуль PWSL открывается поверх Today']},
confirmed:{q:'Вечером: день закрыт, фокус на завтра.',good:['Day confirmed: оплачиваемые часы за день, неделя до 40h с прогнозом овертайма, проверка перерывов','PWSL reports Mon–Sun: Sent / Ready / Missed / upcoming / PTO / Off; «Send» для готового отчёта','«Tomorrow» разворачивается в редактор прямо на Today: время прибытия, длительность, сайты, авто-время выезда','Проверка нехватки времени на дорогу между сайтами','Редактирование до 12:00 AM, затем план фиксируется до утреннего подтверждения']}};
const BAD=[
['Перерывы зачёркнуты','Читаются как отменённые; цвет линий (жёлтый/зелёный) без подписи.'],
['Некорректные времена','Office «4:14 PM» = время ухода; «Leave site 10:09 PM · 14h 9m» без предупреждения об овертайме.'],
['«1 site» в шапке','Не совпадает с планом из 2 сайтов и ничего не говорит о статусе дня.'],
['Нет главного действия','Нет Google Maps, «refresh» висит отдельно, красная рамка у дороги без объяснения.'],
['Tomorrow — статичный','Оранжевый капс «LEAVE HOME/SITE» кричит, редактировать нельзя, 60% экрана пусто.'],
['Нет шагов подтверждения','Ни утреннего «план в силе?», ни вечернего подтверждения лога.']];

let RPT=[{w:'Mon',n:28,st:'sent',at:'4:52 PM'},{w:'Tue',n:29,st:'ready',today:1},{w:'Wed',n:30,st:'up'},{w:'Thu',n:1,st:'up'},{w:'Fri',n:2,st:'pto'},{w:'Sat',n:3,st:'off'},{w:'Sun',n:4,st:'off'}];
function reportsCard(){
const work=RPT.filter(d=>d.st!='off'&&d.st!='pto'),sent=RPT.filter(d=>d.st=='sent').length,ready=RPT.find(d=>d.st=='ready'),miss=RPT.filter(d=>d.st=='miss').length;
const ic={sent:I.chk,ready:'!',miss:I.x,up:'',off:'',pto:''};
const lb={sent:'Sent',ready:'Ready',miss:'Missed',up:'—',off:'Off',pto:'PTO'};
const cells=RPT.map(d=>`<div class="rp ${d.st}${d.today?' td':''}" title="${d.at?'Sent '+d.at:lb[d.st]}"><span class="w">${d.w}</span><span class="c">${ic[d.st]}</span><span class="n num">${d.n}</span></div>`).join('');
return `<div class="card rpc"><div class="rph"><span class="lab">PWSL reports · this week</span><a href="#" class="rpl" onclick="return false">Report ›</a></div>
<div class="rpt"><div class="num"><b>${sent}</b><span> of ${work.length} sent</span></div>${miss?`<span class="rpm">${miss} missed</span>`:''}</div>
<div class="rpg">${cells}</div>
${ready?`<div class="rpf"><span>${ready.w} report ready · not sent yet</span><button class="btn" data-send style="flex:none;height:36px;padding:0 14px;font-size:13.5px">Send</button></div>`:`<div class="rpf"><span class="saved">${I.chk}All reports up to date</span></div>`}</div>`;
}
function offScreen(){
const v=OFFV[OFFK],w={logged:1650,paid:480},tot=w.logged+w.paid;
return `<div class="card hero off ${OFFK}"><div class="eb"><span>${v.eb}</span></div><div class="big" style="font-size:28px;letter-spacing:-.02em">${v.big}</div><div class="sub">${v.s}</div><div class="brow"><button class="btn ghost" style="flex:none;padding:0 16px;height:40px;font-size:13.5px">${I[v.ic]}${v.act}</button></div></div>
<div class="card" style="padding:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span class="lab">This week · Sep 28 – Oct 4</span><a href="Working Timer - Week Timeline.html" style="font-size:13px;font-weight:800;text-decoration:none">Week ›</a></div>
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px"><div class="num" style="font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1;white-space:nowrap">${du(tot)}<small style="font-size:14px;color:var(--text-3);font-weight:700;margin-left:6px;letter-spacing:0">total</small></div><a href="Working Timer - Week Timeline.html" style="font-size:13.5px;font-weight:800;color:var(--warning);text-decoration:none">3 days to plan</a></div>
<div class="segbar"><span style="flex:${w.logged};background:var(--success)"></span><span style="flex:${w.paid};background:var(--pro)"></span></div>
<div class="legend"><span><i class="ld" style="background:var(--success)"></i>Logged <b class="num">${du(w.logged)}</b></span><span><i class="ld" style="background:var(--pro)"></i>Paid off <b class="num">${du(w.paid)}</b></span></div></div>
${tomorrowCard(0,'next')}`;
}
function banner(now){const s=TODAY.sites.find(x=>x.nm==bn.nm)||TODAY.sites[0],pw=bn.t=='pw';
const more=Q.filter(x=>x.nm==bn.nm).length;
return `<div class="bnr${pw?'':' vrb'}"><div class="bnh"><span class="bic">${pw?I.doc:I.mic}</span><div style="flex:1;min-width:0"><div class="bt0">${bn.re?'Reminder':'Arrived'} · ${s.nm} · ${hmT(s.s)}</div><div class="bt1">${pw?'Start PWSL report for this site?':'Record a voice report?'}</div><div class="bt2">${pw?'Takes about a minute. You can finish it later.':'Talk it through — about 30 sec. Linked to this site in Work log.'}</div></div><button class="bx" data-bx aria-label="Dismiss">${I.x}</button></div>
<div class="brow"><button class="btn ghost" data-bsnz>${I.bell}Snooze 10 min</button><button class="btn" data-bstart>${pw?'Start report':I.mic+'Record'}</button></div>${more?`<div class="bq">${more==1?(Q.find(x=>x.nm==bn.nm).t=='vr'?'Voice report':'PWSL report'):more+' more'} next · one prompt at a time</div>`:'<div class="bgrab"></div>'}</div>`}
function renderPanel(){
const n=NOTES[S];
document.getElementById('panel').innerHTML=`<h2>Today — состояния дня</h2><p class="q">Анализ текущих экранов и новая логика по этапам дня.</p>
<div class="thumbs"><img src="uploads/IMG_8266.PNG" alt=""><img src="uploads/IMG_8267.PNG" alt=""><img src="uploads/IMG_8270.PNG" alt=""><img src="uploads/IMG_8271.PNG" alt=""></div>
<div class="plab">Недостатки сейчас</div><div class="plist">${BAD.map((b,i)=>`<div class="iss bad"><span class="n">${i+1}</span><div><b>${b[0]}</b>${b[1]}</div></div>`).join('')}</div>
<div class="plab">${STATES.find(s=>s.k==S).l} — ${n.q}</div><div class="plist">${n.good.map(g=>`<div class="iss good"><span class="n">✓</span><div>${g}</div></div>`).join('')}</div>`;
}

function render(){
const st=STATES.find(s=>s.k==S),now=st.t;
document.getElementById('pick').innerHTML=STATES.map(s=>`<button class="${s.k==S?'on':''}" data-st="${s.k}">${s.l}<i class="num">${hmT(s.t)}</i></button>`).join('');
document.getElementById('pick2').innerHTML=S=='off'?[['off','Day off'],['pto','PTO'],['holiday','Holiday']].map(([k,l])=>`<button class="${k==OFFK?'on':''}" data-ok="${k}">${l}</button>`).join(''):'';
const offD=OFFV[OFFK];
const dot={arrived:'var(--success)',off:{off:'var(--text-3)',pto:'var(--pro)',holiday:'var(--danger)'}[OFFK],morning:'var(--accent)',before:'var(--accent)',during:'var(--success)',after:'var(--warning)',confirmed:'var(--success)'}[S];
const stat={arrived:'On shift · site 1 of 2',off:offD.eb.split(' · ')[0],morning:'Planned · 2 sites',before:'Planned · 2 sites',during:'On shift · site 2 of 2',after:'Needs review',confirmed:'Confirmed'}[S];
let body='';
if(S=='off')body=offScreen();
else if(S=='confirmed')body=confirmedCard()+reportsCard()+tomorrowCard(now);
else body=hero(S,now)+`<div class="lab">Today's timeline</div>`+timeline(TODAY,now);
const ph=document.getElementById('ph');
ph.innerHTML=`<div class="sb"><span class="num">${hs(now)}</span><i></i></div><div class="sc">
<div class="hd"><div><div class="h1">Today</div><div class="date"><i class="ld" style="background:${dot}"></i>${S=='off'?offD.date:'Tue, Sep 29'} · ${stat}</div></div><div class="hr"><span class="probadge">PRO</span><span class="ib">${I.set}</span></div></div>
${body}</div>
<div class="nav"><span class="ni on">${I.today}<span>Today</span></span><a class="ni" href="Working Timer - Week Timeline.html">${I.week}<span>Week</span></a><span class="ni" data-nwl style="cursor:pointer">${I.log}<span>Work log</span></span><span class="ni" data-nvr style="cursor:pointer">${I.mic}<span>Report</span></span></div>
${bn?banner(now):''}${sheet?`<div class="scrim" data-close></div><div class="sheet">${sheet=='morning'?morningSheet():reviewSheet()}</div>`:''}${toast?`<div class="toast">${toast}</div>`:''}`;
renderPanel();bind();
}
function go(k){savedAt=false;REP=structuredClone(REPS[k]||{});VRP=structuredClone(VRPS[k]||{});bn=null;gapUntil=0;const t0=Date.now()+500;Q=k=='arrived'?[{t:'pw',nm:'Office',due:t0},{t:'vr',nm:'Office',due:t0}]:[];S=k;if(!EMB)localStorage.setItem('wt-today-st',k);sheet=k=='morning'?'morning':null;editT=false;openTL=false;render()}
function flash(t){toast=t;render();setTimeout(()=>{toast='';render()},1600)}
function bind(){
const q=(s,f)=>document.querySelectorAll(s).forEach(el=>el.onclick=e=>f(el,e));
q('[data-st]',el=>go(el.dataset.st));
q('[data-ok]',el=>{OFFK=el.dataset.ok;localStorage.setItem('wt-today-offk',OFFK);render()});
q('[data-close]',()=>{if(sheet=='morning'){S='before';localStorage.setItem('wt-today-st',S)}sheet=null;render()});
q('[data-start]',()=>{go('before');flash('Day started · tracking on')});
q('[data-editplan]',()=>{go('before');flash('Opening Planning…')});
q('[data-gooff]',(el,e)=>{e.preventDefault();go('off')});
q('[data-send]',()=>{const d=RPT.find(x=>x.st=='ready');if(d){d.st='sent';d.at='7:31 PM'}flash('PWSL report sent')});
const mark=(t,nm,v)=>{(t=='pw'?REP:VRP)[nm]=v};
q('[data-bstart]',()=>{const b=bn;mark(b.t,b.nm,'sent');closeBn();flash(b.t=='pw'?'Opening PWSL report…':'Opening Voice report…')});
q('[data-pw]',el=>{const nm=el.dataset.pw;if(REP[nm]=='sent')return;REP[nm]='sent';Q=Q.filter(x=>!(x.t=='pw'&&x.nm==nm));if(bn&&bn.t=='pw'&&bn.nm==nm)closeBn();flash('Opening PWSL report…')});
q('[data-vr]',el=>{const nm=el.dataset.vr;if(VRP[nm]=='sent'){flash('Work log · voice report linked to '+nm);return}VRP[nm]='sent';Q=Q.filter(x=>!(x.t=='vr'&&x.nm==nm));if(bn&&bn.t=='vr'&&bn.nm==nm)closeBn();flash('Opening Voice report…')});
q('[data-bx]',()=>{closeBn();render()});
q('[data-bsnz]',()=>{const b=bn;mark(b.t,b.nm,'snoozed');b.re=true;b.due=Date.now()+6000;Q.push(b);closeBn();flash('Reminder in 10 min')});
q('[data-nwl]',()=>flash('Work log · voice reports linked per site'));
q('[data-nvr]',()=>flash('Opening Voice report…'));
q('[data-review]',()=>{sheet='review';render()});
q('[data-confirm]',()=>{go('confirmed');flash('Day confirmed')});
q('[data-tl]',()=>{openTL=!openTL;render()});
q('[data-tt]',el=>{const k=el.dataset.tt;if(editT!=k){draft=structuredClone(k=='tmr'?TMR:PL[k]);editT=k;savedAt=false;render()}});
q('[data-tcancel]',()=>{editT=false;render()});
q('[data-tsave]',()=>{if(!draft.stops.length)return;if(editT=='tmr')TMR=draft;else PL[editT]=draft;savedAt=editT;editT=false;render()});
q('[data-ts]',el=>{draft.stops[+el.dataset.ts].s+= +el.dataset.v;render()});
q('[data-td]',el=>{const s=draft.stops[+el.dataset.td];s.d=Math.max(15,s.d+ +el.dataset.v);render()});
q('[data-mv]',el=>{const j=+el.dataset.mv,k=j+ +el.dataset.v,a=draft.stops;if(k<0||k>=a.length)return;const s0=a[0].s;[a[j],a[k]]=[a[k],a[j]];a[0].s=s0;for(let i=1;i<a.length;i++){const p=a[i-1];a[i].s=p.s+p.d+dr(p.nm,a[i].nm)}render()});
q('[data-del]',el=>{draft.stops.splice(+el.dataset.del,1);render()});
q('[data-add]',el=>{const l=draft.stops.at(-1);const nm=el.dataset.add;const s=l?l.s+l.d+dr(l.nm,nm):480;draft.stops.push({nm,s,d:120});render()});
}
go(S);
if(EMB&&Q0.get('edit')=='tmr'){TMR.stops.push({nm:'Cedar Flats Depot',s:935,d:60});draft=structuredClone(TMR);editT='tmr';render();const sc=document.querySelector('.sc'),tm=document.querySelector('.tm');if(sc&&tm)sc.scrollTop=tm.offsetTop-sc.offsetTop-8;const e=document.querySelectorAll('.est')[1];if(e)e.classList.add('mvd')}
</script>
</body>
