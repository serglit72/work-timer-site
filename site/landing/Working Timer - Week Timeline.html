<title>Working Timer — Week Timeline</title>

<link rel="stylesheet" href="../tokens/colors.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#E7ECF2;display:grid;place-items:center;padding:24px}
a{color:var(--accent)}a:hover{color:var(--accent-press)}
button{font-family:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--text-1);display:flex;flex-direction:column;font-size:15px;line-height:1.35;box-shadow:0 24px 60px rgba(14,23,38,.3);position:relative}
.sb{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-weight:700;font-size:15px}
.sb i{width:24px;height:11px;border-radius:3px;background:var(--success);display:block}
.sc{flex:1;overflow-y:auto;padding:4px 20px 16px;display:flex;flex-direction:column;gap:14px}.sc::-webkit-scrollbar{width:0}
.hd{display:flex;align-items:center;justify-content:space-between}
.h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.rng{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:14px;font-weight:700;color:var(--text-2)}
.arr{width:28px;height:28px;border-radius:50%;background:var(--surface-1);display:grid;place-items:center;color:var(--text-2);border:none;padding:0}
.arr svg{width:14px;height:14px}.arr:disabled{opacity:.35;cursor:default}
.hr{display:flex;gap:8px;align-items:center}
.probadge{height:28px;padding:0 10px;border-radius:999px;background:var(--pro-soft);color:var(--pro);font-size:11px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center}
.ib{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--text-2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.nav{flex:none;height:84px;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:10px 16px 0}

.ni svg{width:24px;height:24px}.ni.on{color:var(--accent)}
.ap{font-size:.62em;font-weight:700;color:var(--text-3);margin-left:2px}
.sum{padding:16px}
.sum .top{display:flex;align-items:baseline;justify-content:space-between}
.sum .big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.sum .big small{font-size:14px;color:var(--text-3);font-weight:700;margin-left:6px;letter-spacing:0}
.sum .todo{font-size:13.5px;font-weight:800;color:var(--warning)}
.segbar{display:flex;gap:3px;height:8px;margin:14px 0 10px}.segbar span{border-radius:4px}
.legend{display:flex;gap:12px;font-size:12px;font-weight:700;color:var(--text-2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}.legend b{color:var(--text-1)}
.ld{width:8px;height:8px;border-radius:50%;flex:none}
.gantt{padding:12px 10px 10px}
.axis{display:grid;grid-template-columns:44px 1fr;gap:8px;margin-bottom:4px;padding-right:6px}
.axis .ticks{position:relative;height:14px}
.axis .ticks span{position:absolute;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--text-3)}
.grow{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;height:76px;padding-right:6px;border-radius:12px}
.grow+.grow{margin-top:2px}
.grow.on{background:var(--surface-1)}
.lb{height:44px;border-radius:10px;border:none;background:none;color:var(--text-2);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.lb b{font-size:16px;color:var(--text-1);letter-spacing:0}
.lb:active{background:var(--surface-2)}
.grow.today .lb,.grow.today .lb b{color:var(--accent)}
.grow.pto .lb,.grow.pto .lb b{color:var(--pro)}
.grow.holiday .lb,.grow.holiday .lb b{color:var(--danger)}
.grow.off .lb b{color:var(--text-3)}
.trk{position:relative;height:100%;cursor:pointer}
.trk .grid{position:absolute;top:6px;bottom:6px;width:1px;background:var(--line)}
.blk{position:absolute;top:6px;height:64px;border-radius:8px;font-size:11px;font-weight:800;color:#06131c;padding:6px 6px;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden;line-height:1.2}
.blk .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .ba{font-size:9.5px;font-weight:700;opacity:.75;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.blk .bi{display:none;font-size:12px;font-weight:800}
.blk.sm .ba{display:none}
.blk.xs{padding:0;align-items:center}.blk.xs .bn,.blk.xs .ba{display:none}.blk.xs .bi{display:block}
.blk.ot{box-shadow:0 0 0 2px var(--danger),0 0 0 4px var(--bg)}
.ot-tag{font-size:9.5px;font-weight:800;color:var(--danger);letter-spacing:0;text-transform:none;margin-top:1px}
.cm{position:absolute;top:36px;height:4px;border-radius:2px;background:var(--text-3);opacity:.55}
.blk.open{background:none;border:1.5px dashed var(--warning);color:var(--warning);align-items:center;text-align:center}

.band small{font-weight:700;opacity:.8;overflow:hidden;text-overflow:ellipsis}
.band.off{background:repeating-linear-gradient(135deg,var(--surface-1) 0 6px,transparent 6px 12px);color:var(--text-3)}
.band.pto{background:var(--pro-soft);color:var(--pro);box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--pro) 35%,transparent)}
.band.holiday{background:var(--danger-soft);color:var(--danger);box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--danger) 35%,transparent)}
.nowl{position:absolute;top:4px;bottom:4px;width:2px;background:var(--danger);border-radius:1px}
.hint{font-size:12px;font-weight:600;color:var(--text-3);text-align:center}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .22s;z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 20px 34px;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:6;max-height:88%;overflow-y:auto}
.sheet::-webkit-scrollbar{width:0}
.phone.sheet-open .scrim{opacity:1;pointer-events:auto}.phone.sheet-open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-strong);margin:0 auto 14px}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.dh .t{font-size:19px;font-weight:800;letter-spacing:-.01em}
.x{width:32px;height:32px;border-radius:50%;background:var(--surface-1);border:none;color:var(--text-2);display:grid;place-items:center;flex:none;padding:0}.x svg{width:15px;height:15px}
.pill{height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}
.tl{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start}
.ev .rail{display:flex;flex-direction:column;align-items:center;align-self:stretch}
.ev .pt{width:10px;height:10px;border-radius:50%;border:2px solid var(--text-3);margin-top:5px;flex:none}
.ev .ln{flex:1;width:2px;background:var(--line-strong);margin:3px 0}
.ev.stop .pt{width:18px;height:18px;border-radius:5px;border:none;background:var(--accent);margin-top:2px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#06131c;font-style:normal}
.ev.stop.lg .pt{background:var(--success)}
.ev .body{padding-bottom:12px;min-width:0}
.ev .en{font-size:15px;font-weight:800}
.ev .ea{font-size:12.5px;font-weight:600;color:var(--text-2);margin-top:1px}
.ev .et{font-size:14px;font-weight:800;text-align:right;padding-top:1px}
.ev .et small{display:block;font-size:12px;color:var(--text-2);font-weight:700}
.ev.drive .body{padding-bottom:10px}.ev.drive .ea{margin-top:0;color:var(--text-3)}
.dfoot{display:flex;gap:8px;margin:4px 0 16px;padding-top:12px;border-top:1px solid var(--line)}
.chip{height:28px;padding:0 10px;border-radius:999px;background:var(--surface-1);font-size:12.5px;font-weight:700;color:var(--text-2);display:inline-flex;align-items:center;gap:5px}.chip b{color:var(--text-1)}
.empty{padding:4px 0 18px}
.empty .t{font-size:15px;font-weight:800}.empty .s{font-size:13.5px;font-weight:600;color:var(--text-2);margin-top:3px;text-wrap:pretty}
.btn{height:50px;border-radius:12px;border:1px solid transparent;font-size:15px;font-weight:800;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#06131c}
.btn.ghost{background:var(--surface);color:var(--text-1);border-color:var(--line-strong)}
.btn svg{width:18px;height:18px}
.brow{display:flex;gap:10px}
/* edit */
.lab{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin:0 0 8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-1);padding:4px;border-radius:12px;margin-bottom:18px}
.seg button{height:36px;border:none;border-radius:9px;background:none;color:var(--text-2);font-size:13px;font-weight:800}
.seg button.on{background:var(--surface-2);color:var(--text-1)}
.seg button.on.pto{color:var(--pro)}.seg button.on.holiday{color:var(--danger)}
.field{display:flex;align-items:center;justify-content:space-between;background:var(--surface-1);border-radius:12px;padding:0 14px;height:50px;margin-bottom:8px;font-size:14.5px;font-weight:700}
.field .v{font-weight:800;display:flex;align-items:center;gap:10px}
.step{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text-1);display:grid;place-items:center;padding:0}.step svg{width:14px;height:14px}
.field input{background:none;border:none;outline:none;color:var(--text-1);font:inherit;font-weight:800;text-align:right;width:180px}
.estop{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto auto;gap:12px;align-items:center;background:var(--surface-1);border-radius:12px;padding:10px 10px 10px 14px;margin-bottom:8px}
.estop .pt{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.estop .en{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.estop .ea{font-size:12px;font-weight:600;color:var(--text-2)}
.estop .tm{font-size:13px;font-weight:800;text-align:right}
.estop .tm small{display:block;font-size:11.5px;color:var(--text-2);font-weight:700}
.mvg{display:flex;flex-direction:column;gap:2px}.mvg button{width:28px;height:18px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text-1);display:grid;place-items:center;padding:0}.mvg button svg{width:12px;height:12px}.mvg button:disabled{opacity:.3;cursor:default}.estop.mvd{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.del{width:30px;height:30px;border-radius:8px;border:none;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center;padding:0}.del svg{width:14px;height:14px}
.add{height:46px;border-radius:12px;border:1.5px dashed var(--line-strong);background:none;color:var(--accent);font-size:14px;font-weight:800;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:18px}.add svg{width:15px;height:15px}
.note{font-size:13px;font-weight:600;color:var(--text-2);margin:-8px 0 18px;text-wrap:pretty}
</style>

<body>
<div class="phone dark" id="ph"></div>
<script>
const I={up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',dn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',

const m=s=>typeof s=='number'?s:(([h,mm])=>h*60+mm)(s.split(':').map(Number));
const hm=x=>{let h=Math.floor(x/60),mm=x%60,ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(mm).padStart(2,'0')}<span class="ap">${ap}</span>`};
const hmT=x=>{let h=Math.floor(x/60),mm=x%60,ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(mm).padStart(2,'0')} ${ap}`};

const OF='1450 Meridian Way, Larkspur Hills',NV='88 Pierline Rd, Port Calder';
const off=(w,n,f)=>({w,n,full:f,st:'off'}),open=(w,n,f)=>({w,n,full:f,st:'open',shift:'8:00'});
const WEEKS=[
{rng:'Sep 28 – Oct 4',days:[
{w:'Mon',n:28,full:'Monday, Sep 28',st:'logged',today:1,leave:'7:35',stops:[{nm:'Work shift',ad:'Logged by GPS',s:'8:00',e:'16:30'}]},
{w:'Tue',n:29,full:'Tuesday, Sep 29',st:'planned',leave:'7:05',stops:[{nm:'Office',ad:OF,s:'7:30',e:'10:00'},{nm:'Harbor Yard',ad:NV,s:'11:05',e:'15:05'}]},
{w:'Wed',n:30,full:'Wednesday, Sep 30',st:'planned',leave:'6:40',stops:[{nm:'Harbor Yard',ad:NV,s:'8:00',e:'10:00'},{nm:'Office',ad:OF,s:'11:05',e:'15:05'}]},
{w:'Thu',n:1,full:'Thursday, Oct 1',st:'planned',leave:'6:30',stops:[{nm:'Office',ad:OF,s:'7:00',e:'8:15'},{nm:'Harbor Yard',ad:NV,s:'8:40',e:'9:50'},{nm:'Cedar Flats Depot',ad:'412 Quarry Ln, Cedar Flats',s:'10:15',e:'11:30'},{nm:'Millbrook Yard',ad:'27 Fernhill Ave, Millbrook',s:'11:55',e:'13:00'},{nm:'Ashford Plant',ad:'9 Kestrel Ct, Ashford',s:'13:25',e:'14:40'},{nm:'Office',ad:OF,s:'15:05',e:'17:30'}]},{w:'Fri',n:2,full:'Friday, Oct 2',st:'pto',hrs:8},off('Sat',3,'Saturday, Oct 3'),off('Sun',4,'Sunday, Oct 4')]},
{rng:'Oct 5 – Oct 11',days:[

{w:'Tue',n:6,full:'Tuesday, Oct 6',st:'planned',leave:'6:40',stops:[{nm:'Harbor Yard',ad:NV,s:'8:00',e:'12:00'},{nm:'Office',ad:OF,s:'13:05',e:'16:30'}]},

{rng:'Oct 12 – Oct 18',days:[

{w:'Tue',n:13,full:'Tuesday, Oct 13',st:'pto',hrs:8},{w:'Wed',n:14,full:'Wednesday, Oct 14',st:'pto',hrs:8},

const SC={logged:['var(--success)','var(--success-soft)','Logged'],planned:['var(--accent)','var(--accent-soft)','Planned'],open:['var(--warning)','var(--warning-soft)','No plan'],off:['var(--text-2)','var(--surface-1)','Day off'],pto:['var(--pro)','var(--pro-soft)','PTO'],holiday:['var(--danger)','var(--danger-soft)','Holiday']};

const ticks=[360,540,720,900,1080],lbl=x=>{let h=x/60;return (h%12||12)+(h>=12?'p':'a')};
const axis=`<div class="axis"><span></span><div class="ticks">${ticks.map(t=>`<span style="left:${pct(t)}%">${lbl(t)}</span>`).join('')}</div></div>`;
const rows=D.map((d,i)=>{let t='';
if(d.stops){t=ticks.map(x=>`<i class="grid" style="left:${pct(x)}%"></i>`).join('');let prev=m(d.leave),cum=0;d.stops.forEach((s,j)=>{cum+=m(s.e)-m(s.s);const ot=cum>OT;t+=`<i class="cm" style="left:${pct(prev)}%;width:${pct(m(s.s))-pct(prev)}%"></i><span class="blk${ot?' ot':''}" style="left:${pct(m(s.s))}%;width:${pct(m(s.e))-pct(m(s.s))}%;background:${SC[d.st][0]}"><span class="bi">${j+1}</span><span class="bn">${s.nm}</span><span class="ba">${s.ad}</span></span>`;prev=m(s.e)})}
else if(d.st=='open'){t=ticks.map(x=>`<i class="grid" style="left:${pct(x)}%"></i>`).join('')+`<span class="blk open" style="left:${pct(m(d.shift))}%;width:${pct(990)-pct(m(d.shift))}%"><span>No plan</span><span class="ba" style="opacity:1">Tap to add</span></span>`}
else if(d.st=='pto')t=`<span class="band pto">PTO<small class="num">${d.hrs}h paid</small></span>`;
else if(d.st=='holiday')t=`<span class="band holiday">Holiday<small>${d.name}</small></span>`;
else t=`<span class="band off">Day off</span>`;
if(d.today)t+=`<i class="nowl" style="left:${pct(1070)}%"></i>`;

return `<div class="grow ${d.st}${d.today?' today':''}${i==sel&&mode?' on':''}"><button class="lb" data-edit="${i}" aria-label="Edit ${d.full}">${d.w}<b class="num">${d.n}</b>${otOf(d)?`<span class="ot-tag num">OT +${du(otOf(d))}</span>`:''}</button><div class="trk" data-open="${i}">${t}</div></div>`}).join('');
ph.innerHTML=`<div class="sb"><span class="num">5:50</span><i></i></div><div class="sc">${head}<div class="card gantt">${axis}${rows}</div><div class="hint">Tap a bar for details · tap a date to edit · <span style="color:var(--danger)">red outline = overtime &gt;8h</span></div></div>
<div class="nav"><a class="ni" href="Working Timer - Today States.html" style="text-decoration:none">${I.today}<span>Today</span></a><div class="ni on">${I.week}<span>Week</span></div><div class="ni">${I.log}<span>Work log</span></div><div class="ni">${I.mic}<span>Report</span></div></div>
<div class="scrim" data-close></div><div class="sheet" id="sh"></div>`;
if(mode=='edit'&&!draft)draft=structuredClone(WEEKS[wk].days[sel]);if(mode){document.getElementById('sh').innerHTML=mode=='edit'?editSheet(draft):detailSheet(D[sel]);requestAnimationFrame(()=>ph.classList.add('sheet-open'))}
bind();
if(EMB&&Q0.has('moved')){const e=ph.querySelectorAll('.estop')[+Q0.get('moved')];if(e)e.classList.add('mvd')}
ph.querySelectorAll('.blk:not(.open)').forEach(b=>{const w=b.offsetWidth;b.classList.toggle('xs',w<40);b.classList.toggle('sm',w>=40&&w<76)});
}

function detailSheet(d){
const c=SC[d.st];
let h=`<div class="grab"></div><div class="dh"><div class="t">${d.full}</div><button class="x" data-close>${I.x}</button></div><span class="pill" style="background:${c[1]};color:${c[0]}"><i class="ld" style="background:${c[0]}"></i>${c[2]}</span>`;
const edit=`<button class="btn${d.st=='open'?'':' ghost'}" data-toedit>${d.st=='open'?I.plus+'Plan day':I.edit+'Edit day'}</button>`;
if(d.st=='open')return h+`<div class="empty"><div class="t">No route yet</div><div class="s num">Shift starts ${hmT(m(d.shift))}. Add stops and we'll tell you when to leave home.</div></div>`+edit;
if(d.st=='pto')return h+`<div class="empty"><div class="t num">Paid time off · ${d.hrs}h</div><div class="s">Counted as paid hours in this week's report. No commute alerts.</div></div>`+edit;
if(d.st=='holiday')return h+`<div class="empty"><div class="t">${d.name}</div><div class="s num">Company holiday · ${d.hrs}h paid. No commute alerts.</div></div>`+edit;
if(d.st=='off')return h+`<div class="empty"><div class="t">Nothing scheduled</div><div class="s">Enjoy the day. You can still add a shift if plans change.</div></div>`+edit;
let ev=`<div class="ev"><div class="rail"><i class="pt"></i><i class="ln"></i></div><div class="body"><div class="en">Leave home</div></div><div class="et num">${hm(m(d.leave))}</div></div>`,prev=m(d.leave),drive=0;
d.stops.forEach((s,j)=>{const dr=m(s.s)-prev;drive+=dr;
ev+=`<div class="ev drive"><div class="rail"><i class="ln"></i></div><div class="body"><div class="ea num">Drive ${du(dr)}</div></div><div></div></div><div class="ev stop${d.st=='logged'?' lg':''}"><div class="rail"><i class="pt">${j+1}</i><i class="ln"></i></div><div class="body"><div class="en">${s.nm}</div><div class="ea">${s.ad}</div></div><div class="et num">${hm(m(s.s))}<small>${du(m(s.e)-m(s.s))}</small></div></div>`;prev=m(s.e)});
ev+=`<div class="ev"><div class="rail"><i class="pt"></i></div><div class="body" style="padding-bottom:4px"><div class="en">Leave site</div></div><div class="et num">${hm(endT(d))}</div></div>`;
return h+`<div class="tl">${ev}</div><div class="dfoot"><span class="chip">Work <b class="num">${du(work(d))}</b></span><span class="chip">Drive <b class="num">${du(drive)}</b></span>${otOf(d)?`<span class="chip" style="background:var(--danger-soft);color:var(--danger)">Overtime <b class="num" style="color:var(--danger)">${du(otOf(d))}</b></span>`:''}</div>`+(d.st=='logged'?`<button class="btn ghost" data-toedit>${I.edit}Correct log</button>`:edit);
}

function editSheet(d){
const kind=d.st=='pto'||d.st=='holiday'||d.st=='off'?d.st:'work';
const tabs=[['work','Work'],['pto','PTO'],['off','Day off'],['holiday','Holiday']].map(([k,l])=>`<button class="${k}${kind==k?' on':''}" data-kind="${k}">${l}</button>`).join('');
let body='';
if(kind=='work'){
const stops=d.stops||[];
body=`<div class="lab">Leave home</div><div class="field"><span>Departure</span><span class="v num"><button class="step" data-lv="-5">${I.min}</button>${d.leave?hmT(m(d.leave)):'Auto'}<button class="step" data-lv="5">${I.plus}</button></span></div>
<div class="lab" style="margin-top:18px;display:flex;justify-content:space-between">Stops<span style="letter-spacing:0;text-transform:none;font-weight:700">Reorder ↑↓ · times update</span></div>${stops.map((s,j)=>`<div class="estop"><i class="pt"></i><div style="min-width:0"><div class="en">${s.nm}</div><div class="ea">${s.ad}</div></div><div class="tm num">${hmT(m(s.s))}<small>${du(m(s.e)-m(s.s))}</small></div><span class="mvg"><button data-mv="${j}" data-v="-1" ${j==0?'disabled':''} aria-label="Move up">${I.up}</button><button data-mv="${j}" data-v="1" ${j==stops.length-1?'disabled':''} aria-label="Move down">${I.dn}</button></span><button class="del" data-del="${j}" aria-label="Remove">${I.x}</button></div>`).join('')}
<button class="add" data-addstop>${I.plus}Add stop</button>`;}
else if(kind=='pto')body=`<div class="field"><span>Paid hours</span><span class="v num"><button class="step" data-hr="-1">${I.min}</button>${d.hrs}h<button class="step" data-hr="1">${I.plus}</button></span></div><p class="note" style="margin-top:8px">Added to paid hours. Commute alerts are off.</p>`;
else if(kind=='holiday')body=`<div class="field"><span>Name</span><input value="${d.name||''}" placeholder="Holiday name" data-hname></div><div class="field"><span>Paid hours</span><span class="v num"><button class="step" data-hr="-1">${I.min}</button>${d.hrs}h<button class="step" data-hr="1">${I.plus}</button></span></div><p class="note" style="margin-top:8px">Commute alerts are off for this day.</p>`;
else body=`<p class="note" style="margin-top:0">No shift, no alerts. Not counted in paid hours.</p>`;
return `<div class="grab"></div><div class="dh"><div class="t">Edit ${d.full.split(',')[0]}<div style="font-size:13px;font-weight:600;color:var(--text-2);margin-top:2px">${d.full.split(', ')[1]}</div></div><button class="x" data-close>${I.x}</button></div>
<div class="lab">Day type</div><div class="seg">${tabs}</div>${body}<div class="brow"><button class="btn ghost" data-cancel>Cancel</button><button class="btn" data-save>Save</button></div>`;
}

function close(){ph.classList.remove('sheet-open');setTimeout(()=>{mode=null;sel=-1;render()},260)}
function reSheet(){document.getElementById('sh').innerHTML=editSheet(draft);bindSheet()}
function bindSheet(){
const q=(s,f)=>ph.querySelectorAll('#sh '+s).forEach(el=>el.onclick=()=>f(el));
q('[data-close]',close);q('[data-cancel]',()=>{mode='detail';render()});
q('[data-toedit]',()=>{draft=structuredClone(WEEKS[wk].days[sel]);mode='edit';document.getElementById('sh').innerHTML=editSheet(draft);bindSheet()});
q('[data-kind]',el=>{const k=el.dataset.kind;
if(k=='work'){if(!['planned','open','logged'].includes(draft.st)){draft.st='open';draft.shift='8:00';delete draft.hrs;delete draft.name}}
else{draft.st=k;delete draft.stops;delete draft.leave;if(k!='off')draft.hrs=draft.hrs||8;if(k=='holiday')draft.name=draft.name||''}
reSheet()});
q('[data-lv]',el=>{if(!draft.stops||!draft.stops.length)return;draft.leave=m(draft.leave)+ +el.dataset.lv;reSheet()});
q('[data-hr]',el=>{draft.hrs=Math.max(1,Math.min(12,draft.hrs+ +el.dataset.hr));reSheet()});
q('[data-del]',el=>{draft.stops.splice(+el.dataset.del,1);if(!draft.stops.length){draft.st='open';draft.shift='8:00';delete draft.stops;delete draft.leave}reSheet()});
q('[data-mv]',el=>{const a=draft.stops,j=+el.dataset.mv,k=j+ +el.dataset.v;if(k<0||k>=a.length)return;const gaps=a.slice(1).map((s,i)=>m(s.s)-m(a[i].e)),t0=m(a[0].s);[a[j],a[k]]=[a[k],a[j]];let t=t0;a.forEach((s,i)=>{const d=m(s.e)-m(s.s);if(i)t+=gaps[i-1];s.s=t;s.e=t+d;t+=d});reSheet()});
q('[data-addstop]',()=>{const st=draft.stops||(draft.stops=[]);const s=st.length?m(st.at(-1).e)+45:480;st.push({nm:'New stop',ad:'Tap to choose address',s,e:s+120});if(!draft.leave)draft.leave=s-30;if(draft.st=='open')draft.st='planned';reSheet()});
const hn=ph.querySelector('#sh [data-hname]');if(hn)hn.oninput=()=>draft.name=hn.value;
q('[data-save]',()=>{if(draft.st=='holiday'&&!draft.name)draft.name='Holiday';WEEKS[wk].days[sel]=draft;mode='detail';render()});
}
function bind(){
ph.querySelectorAll('[data-wk]').forEach(el=>el.onclick=()=>{wk+= +el.dataset.wk;if(!EMB)localStorage.setItem('wt-wk',wk);render()});
ph.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{sel=+el.dataset.open;mode='detail';render()});
ph.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{sel=+el.dataset.edit;draft=structuredClone(WEEKS[wk].days[sel]);mode='edit';render()});
ph.querySelector('.scrim').onclick=close;
bindSheet();
}
render();
</script>
</body>
</html>
